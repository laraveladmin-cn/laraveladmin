map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
upstream local_laraveladmin_cn {
    # Connect IP:Port
    server php:1215 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 16;
}
server {
    listen       80;
    root   /var/www/laravel/laraveladmin/public;
    server_name local.laraveladmin.cn;
	index  index.shtml index.html index.htm index.php;
    sendfile on;
    tcp_nodelay on;
    client_max_body_size 100m;

	#access_log  /data/logs/nginx80_access.log  main;
	#error_log   /data/logs/nginx80_error.log;

	location ~ \.php(/|$) {
		try_files $uri /index.php =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass phpfpm:9000;
    	fastcgi_index index.php;
    	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
	}
    location @local_laraveladmin_cn_http {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_set_header Server-Name $server_name;
        proxy_set_header Server-Addr $server_addr;
        proxy_set_header Server-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://local_laraveladmin_cn;
    }
	location ~ ^/(open|home|admin)/ {
        try_files $uri $uri/ /index.html /index.php?$1;
        break;
    }
    location ~ ^/(web-api/open/delay|api/open/delay|_debugbar) {
        rewrite ^/(.*)$ /index.php?$1 last;
        break;
    }

	location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?$1 last;
            break;
        }
    }
#    location / {
#        try_files $uri $uri/ @local_laraveladmin_cn_http;
#    }

}
